<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DISC1 Psychiatric Interactome</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f0f0f0;
      overflow: hidden;
    }
    #header {
      position: absolute;
      top: 15px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }
    h1 {
      margin: 0 0 5px 0;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    p {
      margin: 0;
      font-size: 13px;
      color: #aaa;
    }
    #network-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>DISC1 Psychiatric Interactome & Hub Network</h1>
    <p>Gold = DISC1 (Target) | Cyan = Interacting Partners | Line thickness = STRING-db Confidence</p>
  </div>
  <div id="network-container"></div>

  <script type="text/javascript">
    const nodes = new vis.DataSet([
      { id: "DISC1", label: "DISC1", color: "#FFD700", size: 38, title: "Target Protein: DISC1\nKey Hub for Neurogenesis" },
      { id: "PDE4B", label: "PDE4B", color: "#00CED1", size: 26, title: "PDE4B\nHigh Betweenness Bottleneck (cAMP signaling)" },
      { id: "NDEL1", label: "NDEL1", color: "#00CED1", size: 24, title: "NDEL1\nMicrotubule organization & neurite outgrowth" },
      { id: "GSK3B", label: "GSK3B", color: "#00CED1", size: 28, title: "GSK3B\nWnt pathway regulatory kinase" },
      { id: "PCM1", label: "PCM1", color: "#00CED1", size: 22, title: "PCM1\nCentrosomal scaffolding component" },
      { id: "CIT", label: "CIT", color: "#00CED1", size: 20, title: "CIT\nCytokinesis & neuronal proliferation" },
      { id: "FEZ1", label: "FEZ1", color: "#00CED1", size: 20, title: "FEZ1\nAxonal outgrowth partner" },
      { id: "DIXDC1", label: "DIXDC1", color: "#00CED1", size: 20, title: "DIXDC1\nNeural progenitor proliferation" },
      { id: "TRAF3IP1", label: "TRAF3IP1", color: "#00CED1", size: 18, title: "TRAF3IP1\nMicrotubule and cilia regulation" },
      { id: "ATF4", label: "ATF4", color: "#00CED1", size: 18, title: "ATF4\nTranscriptional stress response" },
      { id: "SYNE1", label: "SYNE1", color: "#00CED1", size: 18, title: "SYNE1\nNuclear envelope scaffolding" },
      { id: "TNIK", label: "TNIK", color: "#00CED1", size: 18, title: "TNIK\nActin cytoskeleton regulation" },
      { id: "BBS4", label: "BBS4", color: "#00CED1", size: 18, title: "BBS4\nCentrosomal protein" }
    ]);

    const edges = new vis.DataSet([
      { from: "DISC1", to: "PDE4B", value: 3.0, title: "Confidence: 999/1000", color: "#555555" },
      { from: "DISC1", to: "NDEL1", value: 3.0, title: "Confidence: 998/1000", color: "#555555" },
      { from: "DISC1", to: "GSK3B", value: 2.8, title: "Confidence: 960/1000", color: "#555555" },
      { from: "DISC1", to: "PCM1", value: 2.7, title: "Confidence: 940/1000", color: "#555555" },
      { from: "DISC1", to: "CIT", value: 2.5, title: "Confidence: 910/1000", color: "#555555" },
      { from: "DISC1", to: "FEZ1", value: 2.5, title: "Confidence: 890/1000", color: "#555555" },
      { from: "DISC1", to: "DIXDC1", value: 2.4, title: "Confidence: 870/1000", color: "#555555" },
      { from: "DISC1", to: "TRAF3IP1", value: 2.2, title: "Confidence: 820/1000", color: "#555555" },
      { from: "DISC1", to: "ATF4", value: 2.2, title: "Confidence: 810/1000", color: "#555555" },
      { from: "DISC1", to: "SYNE1", value: 2.1, title: "Confidence: 790/1000", color: "#555555" },
      { from: "DISC1", to: "TNIK", value: 2.1, title: "Confidence: 780/1000", color: "#555555" },
      { from: "DISC1", to: "BBS4", value: 2.0, title: "Confidence: 750/1000", color: "#555555" },
      { from: "NDEL1", to: "PCM1", value: 2.4, title: "Confidence: 860/1000", color: "#444444" },
      { from: "GSK3B", to: "DIXDC1", value: 2.3, title: "Confidence: 840/1000", color: "#444444" },
      { from: "PDE4B", to: "DISC1", value: 3.0, title: "Confidence: 999/1000", color: "#555555" }
    ]);

    const container = document.getElementById("network-container");
    const data = { nodes: nodes, edges: edges };
    const options = {
      physics: {
        forceAtlas2Based: {
          gravitationalConstant: -70,
          centralGravity: 0.01,
          springLength: 120,
          springConstant: 0.08
        },
        maxVelocity: 50,
        solver: "forceAtlas2Based",
        timestep: 0.35,
        stabilization: { iterations: 150 }
      },
      interaction: {
        hover: true,
        tooltipDelay: 100
      }
    };

    new vis.Network(container, data, options);
  </script>
</body>
</html>
